name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Files ko sahi folder mein rakho
        run: |
          mkdir -p src/main/java/com/monkeybot src/main/res/xml
          mv AndroidManifest.xml src/main/AndroidManifest.xml
          mv accessibility_config.xml src/main/res/xml/accessibility_config.xml
          mv Bot.kt src/main/java/com/monkeybot/Bot.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: APK ko download link par daalo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Monkey Bot APK ${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
